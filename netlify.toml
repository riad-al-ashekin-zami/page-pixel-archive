[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"

# Asset pointers are served by Lovable, not by Nitro. Proxy only this public
# media namespace so the same pointers work on external/custom domains.
[[redirects]]
  from = "/__l5e/assets-v1/*"
  to = "https://id-preview--0a9d216f-7ab2-4994-b44d-f3b8474f2751.lovable.app/__l5e/assets-v1/:splat"
  status = 200
  force = true